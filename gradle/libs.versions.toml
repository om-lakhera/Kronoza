[versions]
agp = "9.1.1"
activityCompose = "1.10.1"
androidxCore = "1.18.0"
androidxTestCore = "1.6.1"
composeBom = "2024.09.00"
espressoCore = "3.7.0"
junit = "4.13.2"
junitExt = "1.3.0"
kotlin = "2.4.21"
kotlinxCoroutines = "1.10.2"
ksp = "2.3.5"
